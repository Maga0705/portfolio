<!DOCTYPE html>
<html lang="nl-BE">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact - Mukhammad Abduev</title>
	<meta name="description" content="Heb je een vraag? Stuur me een bericht.">
	<link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="bg-gray-50 text-gray-800">
	<a href="#inhoud" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:text-blue-800">Ga naar de inhoud</a>

	<header class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between border-b border-gray-200">
		<p class="text-xl font-bold">Mukhammad Abduev</p>
		<input type="checkbox" id="menu-knop" class="peer sr-only">
		<label for="menu-knop" class="cursor-pointer rounded-lg border border-gray-300 px-3 py-2 peer-focus-visible:outline-2 md:hidden">Menu</label>
		<nav aria-label="Hoofdmenu" class="hidden w-full peer-checked:block md:block md:w-auto">
			<ul class="flex flex-col md:flex-row md:gap-2">
				<li><a href="index.html" class="block rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-blue-700">Home</a></li>
				<li><a href="portfolio.html" class="block rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-100 focus-visible:outline-2 focus-visible:outline-blue-700">Portfolio</a></li>
				<li><a href="contact.html" aria-current="page" class="block rounded-lg bg-blue-100 px-3 py-2 font-semibold text-blue-800 focus-visible:outline-2 focus-visible:outline-blue-700">Contact</a></li>
			</ul>
		</nav>
	</header>

	<div class="max-w-6xl mx-auto px-4">
		<div class="grid grid-cols-1 gap-8 py-8 md:grid-cols-3">

			<main id="inhoud" class="md:col-span-2">

				<h1 class="text-2xl font-bold mb-4">Contact</h1>
				<p class="mb-6 text-lg text-gray-600">Heb je een vraag of wil je samenwerken? Stuur me een bericht.</p>

				<form name="contact" method="POST" data-netlify="true" class="max-w-md space-y-4">

					<div>
						<label for="naam" class="block font-medium">Naam</label>
						<input type="text" id="naam" name="naam" autocomplete="name" required
							class="mt-1 w-full rounded-lg border border-gray-400 bg-white px-3 py-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">
					</div>

					<div>
						<label for="email" class="block font-medium">E-mailadres</label>
						<input type="email" id="email" name="email" autocomplete="email" required
							class="mt-1 w-full rounded-lg border border-gray-400 bg-white px-3 py-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">
					</div>

					<div>
						<label for="onderwerp" class="block font-medium">Onderwerp</label>
						<input type="text" id="onderwerp" name="onderwerp"
							class="mt-1 w-full rounded-lg border border-gray-400 bg-white px-3 py-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">
					</div>

					<div>
						<label for="bericht" class="block font-medium">Bericht</label>
						<textarea id="bericht" name="bericht" rows="5" required
							class="peer mt-1 w-full rounded-lg border border-gray-400 bg-white px-3 py-2 user-invalid:border-red-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700"></textarea>
					</div>

					<div>
						<button type="submit"
							class="rounded-lg bg-blue-700 px-5 py-2 font-semibold text-white hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700">
							Verstuur bericht
						</button>
						<p class="mt-3 text-sm text-gray-600">Ik ga niks doen met je info, geen stress :D</p>
					</div>

				</form>

			</main>

			<aside class="bg-gray-100 p-4 rounded-lg">

				<h2 class="font-bold mb-2">Contactgegevens</h2>
				<p class="text-sm text-gray-600"><a href="mailto:s167266@ap.be" class="text-blue-700 no-underline hover:underline">s167266@ap.be</a></p>
				<p class="text-sm text-gray-600">Antwerpen, België</p>

			</aside>

		</div>
	</div>

	<footer class="border-t border-gray-200 py-4 text-center text-sm text-gray-600">
		<p>&copy; 2026 Mukhammad Abduev - AP Hogeschool Antwerpen</p>
	</footer>

</body>
</html>
